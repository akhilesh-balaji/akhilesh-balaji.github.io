name: Build and Deploy Fresh to GitHub Pages

on:
  push:
    branches:
      - fresh-version

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fresh-version
        uses: actions/checkout@v4
        with:
          ref: fresh-version
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build static site
        run: deno task build

      - name: Deploy to master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir /tmp/deploy

          cp -r _site/* /tmp/deploy/

          git checkout master || git checkout --orphan master

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cp -r /tmp/deploy/* .

          touch .nojekyll

          git add .

          git commit -m "Deploy from fresh-version" || echo "No changes"

          git push origin master
