<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved — Akhilesh Balaji</title>
  <link rel="icon" href="/favicon.ico"/>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/iosevka-aile@5.4.0/index.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --base:     #24273a;
      --mantle:   #1e2030;
      --crust:    #181926;
      --text:     #cad3f5;
      --subtext1: #b8c0e0;
      --surface0: #363a4f;
      --overlay0: #6e738d;
      --blue:     #8aadf4;
      --teal:     #8bd5ca;
      --font: 'Iosevka Aile Variable', 'Iosevka Aile', ui-sans-serif, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--crust);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: var(--mantle);
      border: 1px solid var(--surface0);
      border-radius: 0.75rem;
      padding: 1.75rem 2rem;
      max-width: 520px;
      width: 100%;
    }

    .tag {
      display: inline-block;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--blue);
      background: rgba(138,173,244,0.1);
      border: 1px solid rgba(138,173,244,0.25);
      border-radius: 99px;
      padding: 0.25rem 0.9rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-weight: 400;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.85rem;
      color: var(--subtext1);
      line-height: 1.7;
      margin-bottom: 2.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--blue);
      color: var(--mantle);
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      border: none;
      border-radius: 99px;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #a0bcf8;
    }

    .btn svg { flex-shrink: 0; }

    .divider {
      border: none;
      border-top: 1px solid var(--surface0);
      margin: 2.25rem 0 1.5rem;
    }

    .footer {
      font-size: 0.7rem;
      color: var(--overlay0);
    }

    .footer a {
      color: var(--teal);
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">301</div>

    <h1>My website has changed its address.</h1>

    <p>
      Please update your bookmarks accordingly.
    </p>

    <a class="btn" href="https://website.akhilesh-balaji.deno.net/" target="_blank" rel="noopener noreferrer">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.14645 3.14645C8.34171 2.95118 8.65829 2.95118 8.85355 3.14645L12.8536 7.14645C13.0488 7.34171 13.0488 7.65829 12.8536 7.85355L8.85355 11.8536C8.65829 12.0488 8.34171 12.0488 8.14645 11.8536C7.95118 11.6583 7.95118 11.3417 8.14645 11.1464L11.2929 8H2.5C2.22386 8 2 7.77614 2 7.5C2 7.22386 2.22386 7 2.5 7H11.2929L8.14645 3.85355C7.95118 3.65829 7.95118 3.34171 8.14645 3.14645Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"/>
      </svg>
      Go to new site
    </a>

    <hr class="divider">

    <p class="footer">
      <a href="https://website.akhilesh-balaji.deno.net/">website.akhilesh-balaji.deno.net</a>
    </p>
  </div>
</body>
</html>
